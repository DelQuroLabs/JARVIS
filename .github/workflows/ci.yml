name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: cd server && npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck server
        run: cd server && npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Option 1: Coolify GitHub integration (recommended)
      # Push to main triggers Coolify to rebuild automatically.
      # No action needed here — Coolify watches the repo.

      # Option 2: Webhook deploy (if not using Coolify's GitHub integration)
      # Uncomment and set COOLIFY_WEBHOOK secret.
      # - name: Trigger Coolify deploy
      #   run: |
      #     curl -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{"force": true}'

      - name: Deploy note
        run: echo "Push to main detected. If Coolify watches this repo, it will auto-deploy. Otherwise, set COOLIFY_WEBHOOK secret."
