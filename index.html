<!doctype html>
<html lang="en" data-theme="dark" data-accent="aqua">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>JARVIS - local-first agent workspace</title>
    <meta name="description" content="An agent workspace that plans, uses tools, runs sandboxed code and remembers - entirely in your browser, with your own free model key." />
    <meta name="theme-color" content="#07090d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JARVIS" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <style>
      /* Painted before the bundle loads so there is no white flash on a dark device. */
      html { background: #07090d; }
      @media (prefers-color-scheme: light) { html[data-theme='light'] { background: #f4f6fa; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 22px; height: 22px; border-radius: 99px; border: 2px solid rgba(53,224,192,.25); border-top-color: #35e0c0; animation: s .7s linear infinite; display: block; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <noscript>
      <p style="color:#e9eef6;font-family:system-ui;padding:24px">
        JARVIS runs entirely in the browser, so it needs JavaScript. Nothing is sent to a server either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
